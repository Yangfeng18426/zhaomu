<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="拾光">
<meta name="theme-color" content="#f4ede1">
<meta name="description" content="拾光 · 私人灵感手账：捡拾光阴里的光">
<meta name="format-detection" content="telephone=no">
<title>拾光</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4ede1;--card:#fffdf8;--ink:#3a342c;--ink-light:#9a8f7e;--border:#e8ddc9;
  --accent:#c8743a;--accent-soft:#f6e7d8;
  --beauty:#b56a8c;--beauty-soft:#f6e2ec;
  --track:#5b8c6e;--track-soft:#e3efe7;
  --danger:#c0392b;--success:#5b8c6e;
  --shadow:0 2px 14px rgba(120,100,70,.12);
  --radius:18px;--radius-sm:12px;
  --safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px);
  --nav-h:60px;--fab-size:56px;--header-h:62px;
}
html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:contain}
textarea,input{-webkit-user-select:text;user-select:text;font-family:inherit}
@media(display-mode:standalone){.app-header{padding-top:calc(10px + var(--safe-top))}}

/* ===== Header ===== */
.app-header{position:sticky;top:0;z-index:20;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(244,237,225,.92);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid rgba(200,180,150,.18)}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand h1{font-size:26px;font-weight:700;letter-spacing:2px;color:var(--ink)}
.brand .sub{font-size:11px;color:var(--ink-light);letter-spacing:1px;margin-top:2px}
.btn-icon{width:40px;height:40px;border-radius:50%;border:none;background:transparent;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.btn-icon:active{background:rgba(0,0,0,.06)}

/* ===== Main ===== */
.app-main{padding:14px 16px calc(var(--nav-h) + 96px);max-width:640px;margin:0 auto}

/* ===== 鼓励书签 ===== */
.quote-card{background:linear-gradient(135deg,#fffdf8,#f7eede);border-left:4px solid var(--accent);border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow);position:relative}
.quote-tag{font-size:11px;color:var(--accent);letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.quote-text{font-size:16px;line-height:1.75;color:var(--ink);font-style:italic}
.quote-meta{margin-top:10px;display:flex;justify-content:space-between;align-items:center}
.quote-author{font-size:13px;color:var(--ink-light)}
.quote-refresh{width:30px;height:30px;border-radius:50%;border:none;background:var(--accent-soft);color:var(--accent);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.quote-refresh:active{transform:scale(.92)}

/* ===== 列表 ===== */
.tab-title{font-size:14px;color:var(--ink-light);margin:4px 2px 12px;display:flex;justify-content:space-between;align-items:center}
.tab-title .count{font-weight:600;color:var(--accent)}

.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;animation:cardIn .25s ease;position:relative}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card .text{font-size:16px;line-height:1.6;color:var(--ink);white-space:pre-wrap;word-break:break-word;padding-right:54px}
.card .time{font-size:12px;color:var(--ink-light);margin-top:10px}
.card .actions{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.card .act{width:30px;height:30px;border-radius:50%;border:none;background:transparent;color:var(--ink-light);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.card .act:active{background:rgba(0,0,0,.05);color:var(--accent)}

/* 类型标签色 */
.card.idea{border-top:3px solid var(--accent)}
.card.beauty{border-top:3px solid var(--beauty)}
.card.track{border-top:3px solid var(--track)}

/* 追踪进度 */
.track-status{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:20px;margin-bottom:8px}
.track-status.tracking{background:var(--track-soft);color:var(--track)}
.track-status.done{background:#eef0e8;color:#7a7a55}
.progress-bar{height:7px;border-radius:6px;background:#ece4d6;overflow:hidden;margin:10px 0 6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--track),#7fae8f);border-radius:6px;transition:width .4s}
.progress-meta{font-size:12px;color:var(--ink-light);display:flex;justify-content:space-between}
.log-item{font-size:13px;color:var(--ink-light);padding:6px 0;border-top:1px dashed #ece4d6;line-height:1.5}
.log-item:first-child{border-top:none}
.log-item b{color:var(--ink);font-weight:600}

/* 空状态 */
.empty{text-align:center;padding:48px 20px;color:var(--ink-light)}
.empty .big{font-size:46px;margin-bottom:12px}
.empty p{font-size:14px;line-height:1.7}

/* ===== 底部导航 ===== */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:30;height:calc(var(--nav-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);display:flex;background:rgba(255,253,248,.96);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-top:1px solid rgba(200,180,150,.25)}
.nav-tab{flex:1;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--ink-light);font-size:12px;transition:color .15s}
.nav-tab .nav-icon{font-size:21px;line-height:1}
.nav-tab.active{color:var(--accent)}
.nav-tab.active .nav-icon{transform:translateY(-1px)}

/* ===== FAB ===== */
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px);z-index:31;width:var(--fab-size);height:var(--fab-size);border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(200,116,58,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.92)}

/* ===== 弹窗 ===== */
.mask{position:fixed;inset:0;z-index:40;background:rgba(40,34,26,.45);display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + var(--safe-bottom));animation:sheetUp .28s cubic-bezier(.25,.8,.25,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet h3{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 .close{font-size:22px;color:var(--ink-light);cursor:pointer;font-weight:400}
.sheet textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:14px;font-size:16px;line-height:1.6;color:var(--ink);background:#fffdf9;outline:none;resize:none;min-height:110px}
.sheet textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:active{opacity:.88}
.btn-ghost{background:#f0e9dc;color:var(--ink)}
.btn-ghost:active{opacity:.85}
.btn-danger{background:#fbeae8;color:var(--danger)}

/* 进度输入 */
.progress-input{display:flex;align-items:center;gap:12px;margin-top:14px}
.progress-input label{font-size:14px;color:var(--ink-light);white-space:nowrap}
.progress-input input{width:72px;border:1px solid var(--border);border-radius:10px;padding:8px;font-size:15px;text-align:center;background:#fffdf9;outline:none}
.progress-input input:focus{border-color:var(--accent)}

/* 菜单列表 */
.menu-list{display:flex;flex-direction:column}
.menu-item{display:flex;align-items:center;gap:14px;padding:15px 6px;border-bottom:1px solid #f0e9dc;cursor:pointer;font-size:16px;color:var(--ink);background:transparent;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
.menu-item:last-child{border-bottom:none}
.menu-item:active{background:#f7f0e4}
.menu-item .mi-icon{font-size:20px;width:26px;text-align:center}
.menu-item .mi-sub{font-size:12px;color:var(--ink-light);margin-left:auto}

/* 报告 */
.report-grid{display:flex;gap:10px;margin-bottom:14px}
.report-cell{flex:1;background:#fffdf9;border:1px solid var(--border);border-radius:14px;padding:16px 10px;text-align:center}
.report-cell .num{font-size:28px;font-weight:700;color:var(--accent)}
.report-cell .lab{font-size:12px;color:var(--ink-light);margin-top:4px}
.report-line{font-size:14px;line-height:1.8;color:var(--ink);background:#fffdf9;border-radius:12px;padding:14px;border:1px solid var(--border)}

/* 安装横幅 */
.install-banner{position:fixed;top:calc(var(--safe-top) + 8px);left:12px;right:12px;z-index:35;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:bannerIn .3s}
.install-banner.show{display:flex}
@keyframes bannerIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
.install-banner .ib-icon{font-size:22px}
.install-banner .ib-text{flex:1;font-size:13px;line-height:1.4}
.install-banner .ib-btn{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.install-banner .ib-close{background:transparent;border:none;color:rgba(255,255,255,.6);font-size:18px;cursor:pointer}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 90px);transform:translateX(-50%);z-index:50;background:rgba(40,34,26,.92);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:80%;text-align:center}
.toast.show{opacity:1}

.hint{font-size:11px;color:var(--ink-light);margin-top:8px;line-height:1.6;text-align:center}

/* ===== 光影（照片日志） ===== */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-item{border-radius:14px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);position:relative;aspect-ratio:1/1;cursor:pointer}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block}
.photo-item .photo-cap{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo-item .photo-date{position:absolute;top:6px;right:6px;font-size:10px;color:#fff;background:rgba(0,0,0,.4);padding:2px 6px;border-radius:8px}
.photo-view{width:100%;border-radius:12px;margin-bottom:12px;max-height:48vh;object-fit:cover}
.book-cover{padding-top:38vh;text-align:center}
.book-cover h1{font-size:30px;letter-spacing:4px;color:#3a342c}
.book-cover .sub{margin-top:10px;color:#9a8f7e;font-size:14px;letter-spacing:2px}
.book-cover p{color:#9a8f7e;margin-top:8px}
.book-page{text-align:center}
.book-page img{max-width:88%;max-height:72vh;border-radius:8px}
.book-cap{font-size:14px;margin-top:12px;color:#333}
.book-date{font-size:11px;color:#999;margin-top:4px}

/* 打印（相片书） */
#printBook{display:none}
@media print{
  body{background:#fff!important}
  .app-header,.app-main,.bottom-nav,.fab,.install-banner,.mask,.toast{display:none!important}
  #printBook{display:block!important;padding:0}
  .book-cover{page-break-after:always}
  .book-page{page-break-after:always;padding:20px 0}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <h1>拾光</h1>
    <span class="sub">捡拾光阴里的光</span>
  </div>
  <button class="btn-icon" id="menuBtn" title="菜单">⋯</button>
</header>

<main class="app-main">
  <!-- 鼓励书签 -->
  <div class="quote-card" id="quoteCard">
    <div class="quote-tag">✨ 今日一句</div>
    <div class="quote-text" id="quoteText">—</div>
    <div class="quote-meta">
      <span class="quote-author" id="quoteAuthor"></span>
      <button class="quote-refresh" id="quoteRefresh" title="换一句">↻</button>
    </div>
  </div>

  <div class="tab-title">
    <span id="tabLabel">妙想</span>
    <span class="count" id="tabCount">0</span>
  </div>

  <div id="list"></div>
</main>

<!-- 底部导航 -->
<nav class="bottom-nav">
  <button class="nav-tab active" data-tab="idea"><span class="nav-icon">💡</span><span>妙想</span></button>
  <button class="nav-tab" data-tab="beauty"><span class="nav-icon">🌸</span><span>美好</span></button>
  <button class="nav-tab" data-tab="track"><span class="nav-icon">🎯</span><span>追踪</span></button>
  <button class="nav-tab" data-tab="photo"><span class="nav-icon">📷</span><span>光影</span></button>
</nav>

<button class="fab" id="fab">+</button>

<!-- 安装横幅 -->
<div class="install-banner" id="installBanner">
  <span class="ib-icon">📲</span>
  <span class="ib-text">把「拾光」装到桌面，随时记录</span>
  <button class="ib-btn" id="installBtn">安装</button>
  <button class="ib-close" id="installClose">✕</button>
</div>

<!-- 添加/编辑 弹窗 -->
<div class="mask" id="editMask">
  <div class="sheet">
    <h3><span id="editTitle">记下妙想</span><span class="close" data-close="editMask">✕</span></h3>
    <textarea id="editInput" placeholder="此刻掠过脑海的一个念头……"></textarea>
    <div class="row">
      <button class="btn btn-ghost" data-close="editMask">取消</button>
      <button class="btn btn-primary" id="editSave">保存</button>
    </div>
  </div>
</div>

<!-- 追踪进度 弹窗 -->
<div class="mask" id="trackMask">
  <div class="sheet">
    <h3><span>更新进度</span><span class="close" data-close="trackMask">✕</span></h3>
    <div class="text" id="trackTargetText" style="font-size:14px;color:var(--ink-light);margin-bottom:10px;line-height:1.5"></div>
    <textarea id="trackInput" placeholder="记录这一步的进展、想法或卡点……"></textarea>
    <div class="progress-input">
      <label>完成度</label>
      <input type="number" id="trackProgress" min="0" max="100" value="0">
      <span style="font-size:14px;color:var(--ink-light)">%</span>
    </div>
    <div class="row">
      <button class="btn btn-ghost" data-close="trackMask">取消</button>
      <button class="btn btn-primary" id="trackSave">保存进度</button>
    </div>
  </div>
</div>

<!-- 菜单 弹窗 -->
<div class="mask" id="menuMask">
  <div class="sheet">
    <h3><span>更多</span><span class="close" data-close="menuMask">✕</span></h3>
    <div class="menu-list">
      <button class="menu-item" data-act="report-week"><span class="mi-icon">📊</span>本周复盘<span class="mi-sub">周报</span></button>
      <button class="menu-item" data-act="report-month"><span class="mi-icon">🗓️</span>本月复盘<span class="mi-sub">月报</span></button>
      <button class="menu-item" data-act="export"><span class="mi-icon">⬇️</span>下载备份<span class="mi-sub">JSON</span></button>
      <button class="menu-item" data-act="copy"><span class="mi-icon">📋</span>复制备份<span class="mi-sub">到剪贴板</span></button>
      <button class="menu-item" data-act="import"><span class="mi-icon">⬆️</span>导入备份<span class="mi-sub">合并 / 替换</span></button>
      <button class="menu-item" data-act="pdf"><span class="mi-icon">📖</span>导出相片书<span class="mi-sub">PDF</span></button>
      <button class="menu-item" data-act="about"><span class="mi-icon">🌟</span>关于拾光<span class="mi-sub">v1.1</span></button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>
</div>

<!-- 报告 弹窗 -->
<div class="mask" id="reportMask">
  <div class="sheet">
    <h3><span id="reportTitle">本周复盘</span><span class="close" data-close="reportMask">✕</span></h3>
    <div class="report-grid">
      <div class="report-cell"><div class="num" id="rIdea">0</div><div class="lab">妙想</div></div>
      <div class="report-cell"><div class="num" id="rBeauty">0</div><div class="lab">美好</div></div>
      <div class="report-cell"><div class="num" id="rTrack">0</div><div class="lab">追踪</div></div>
    </div>
    <div class="report-line" id="reportLine"></div>
    <div class="hint">数据只存在你这台设备上，记得定期备份。</div>
  </div>
</div>

<!-- 照片选择 弹窗 -->
<div class="mask" id="photoPickerMask">
  <div class="sheet">
    <h3><span>添加光影</span><span class="close" data-close="photoPickerMask">✕</span></h3>
    <div class="menu-list">
      <button class="menu-item" data-pick="camera"><span class="mi-icon">📷</span>拍照</button>
      <button class="menu-item" data-pick="album"><span class="mi-icon">🖼️</span>从相册选择</button>
    </div>
  </div>
</div>

<!-- 照片详情 / 注脚 弹窗 -->
<div class="mask" id="photoMask">
  <div class="sheet">
    <h3><span>光影</span><span class="close" data-close="photoMask">✕</span></h3>
    <img id="photoView" class="photo-view" src="" alt="">
    <textarea id="photoCaption" placeholder="为这一刻写句注脚……"></textarea>
    <div class="row">
      <button class="btn btn-danger" id="photoDelete">删除</button>
      <button class="btn btn-primary" id="photoSaveCap">保存注脚</button>
    </div>
  </div>
</div>

<!-- 相片书打印容器 -->
<div id="printBook"></div>

<!-- 照片输入（隐藏） -->
<input type="file" id="photoCamera" accept="image/*" capture="environment" style="display:none">
<input type="file" id="photoAlbum" accept="image/*" style="display:none">

<div class="toast" id="toast"></div>

<script>

 {c:'治愈·温柔',t:'世界以痛吻我，要我报之以歌。',a:'泰戈尔',s:'《飞鸟集》'},

/* ========== 数据层 ========== */
var DATA_KEY='shiguang_v1';
var state={entries:[]};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function pad(n){return n<10?'0'+n:''+n}
function fmt(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
function load(){
  try{var raw=localStorage.getItem(DATA_KEY);if(raw){state.entries=JSON.parse(raw).entries||[];}}catch(e){}
  if(!state.entries.length) migrate();
}
function save(){try{localStorage.setItem(DATA_KEY,JSON.stringify({version:1,entries:state.entries}));}catch(e){}}
function migrate(){
  try{
    var old=JSON.parse(localStorage.getItem('inspire_notes_v4')||'[]');
    if(old&&old.length){
      old.forEach(function(n){
        var e={id:n.id||uid(),type:'idea',text:n.text||'',createdAt:n.ts||Date.now(),updatedAt:n.ts||Date.now(),track:null};
        if(n.type==='beauty')e.type='beauty';
        else if(n.type==='determination')e.type='track';
        else if(n.type==='inspire'||n.type==='other')e.type='idea';
        if(n.trackingStatus==='tracking'||n.trackingStatus==='done'){
          if(e.type==='beauty')e.type='track';
          e.track={status:n.trackingStatus==='done'?'done':'tracking',log:(n.trackLog||[]).map(function(l){return{t:l.ts||Date.now(),note:l.note||'',progress:0}}),startedAt:n.trackStartedAt||n.ts||Date.now(),doneAt:n.trackingStatus==='done'?(n.doneAt||Date.now()):null,progress:0};
        }
        state.entries.push(e);
      });
      save();
    }
  }catch(e){}
}

/* ========== 渲染 ========== */
var currentTab='idea';
var TAB_LABEL={idea:'妙想',beauty:'美好',track:'追踪',photo:'光影'};
var listEl=document.getElementById('list');
var tabLabelEl=document.getElementById('tabLabel');
var tabCountEl=document.getElementById('tabCount');

function entriesForTab(){
  var list=state.entries.filter(function(e){
    if(currentTab==='idea')return e.type==='idea'&&!e.track;
    if(currentTab==='beauty')return e.type==='beauty';
    if(currentTab==='track')return !!e.track;
    return false;
  });
  list.sort(function(a,b){return (b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt);});
  return list;
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderList(){
  if(currentTab==='photo'){renderPhotos();return;}
  tabLabelEl.textContent=TAB_LABEL[currentTab];
  var list=entriesForTab();
  tabCountEl.textContent=list.length;
  if(!list.length){
    var tips={idea:'一个闪过的念头，也许是未来的大主意。点右下角 + 记下它。',beauty:'身边让你愉悦的小事，都值得被收好。',track:'立一个想去追踪的目标，看着它一点点完成。'};
    listEl.innerHTML='<div class="empty"><div class="big">🌿</div><p>'+tips[currentTab]+'</p></div>';
    return;
  }
  var html='';
  list.forEach(function(e){
    if(currentTab==='track'){
      var tr=e.track;var pct=tr.progress||0;
      var logs=(tr.log||[]).slice().reverse().map(function(l){return '<div class="log-item"><b>'+fmt(l.t)+'</b>　'+(esc(l.note)||'（更新进度）')+'</div>';}).join('');
      html+='<div class="card track" data-id="'+e.id+'">'
        +'<div class="actions"><button class="act" data-act="edit" title="编辑">✏️</button><button class="act" data-act="del" title="删除">🗑️</button></div>'
        +'<span class="track-status '+(tr.status==='done'?'done':'tracking')+'">'+(tr.status==='done'?'已完成':'追踪中')+'</span>'
        +'<div class="text">'+esc(e.text)+'</div>'
        +'<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div>'
        +'<div class="progress-meta"><span>完成度 '+pct+'%</span><button class="act" data-act="update" style="position:static;width:auto;height:auto;padding:0 4px;font-size:13px;color:var(--track);font-weight:600">+ 更新进度</button></div>'
        + (tr.status!=='done'?'<div class="progress-meta" style="margin-top:6px"><button class="act" data-act="done" style="position:static;width:auto;height:auto;padding:0;font-size:13px;color:var(--accent);font-weight:600">✓ 标记完成</button></div>':'')
        + (logs?'<div style="margin-top:8px">'+logs+'</div>':'')
        +'</div>';
    }else{
      var acts='';
      if(currentTab==='idea')acts+='<button class="act" data-act="track" title="开始追踪">🎯</button>';
      acts+='<button class="act" data-act="edit" title="编辑">✏️</button><button class="act" data-act="del" title="删除">🗑️</button>';
      html+='<div class="card '+currentTab+'" data-id="'+e.id+'">'
        +'<div class="actions">'+acts+'</div>'
        +'<div class="text">'+esc(e.text)+'</div>'
        +'<div class="time">'+fmt(e.createdAt)+'</div>'
        +'</div>';
    }
  });
  listEl.innerHTML=html;
}

var trackMask=document.getElementById('trackMask');
var trackInput=document.getElementById('trackInput');
var trackProgress=document.getElementById('trackProgress');
var trackTargetText=document.getElementById('trackTargetText');
var trackingId=null;
document.getElementById('trackSave').addEventListener('click',function(){
  var e=state.entries.find(function(x){return String(x.id)===String(trackingId)});if(!e||!e.track){trackMask.classList.remove('show');return;}
  var p=parseInt(trackProgress.value,10);if(isNaN(p))p=0;if(p<0)p=0;if(p>100)p=100;
  var note=trackInput.value.trim();
  e.track.log.push({t:Date.now(),note:note,progress:p});
  e.track.progress=p;e.updatedAt=Date.now();
  if(p>=100){e.track.status='done';e.track.doneAt=Date.now();}
  save();trackMask.classList.remove('show');renderList();toast('进度已更新');
});

listEl.addEventListener('click',function(ev){
  if(currentTab==='photo'){var pi=ev.target.closest('.photo-item');if(pi)openPhoto(pi.dataset.id);return;}
  var card=ev.target.closest('.card');if(!card)return;
  var id=card.dataset.id;var e=state.entries.find(function(x){return String(x.id)===String(id)});if(!e)return;
  var actBtn=ev.target.closest('[data-act]');if(!actBtn)return;
  var act=actBtn.dataset.act;
  if(act==='del'){if(confirm('删除这条记录？')){state.entries=state.entries.filter(function(x){return String(x.id)!==String(id);});save();renderList();toast('已删除');}}
  else if(act==='edit'){editingId=id;editTitle.textContent='编辑';editInput.value=e.text;editMask.classList.add('show');setTimeout(function(){editInput.focus();},200);}
  else if(act==='track'){e.track={status:'tracking',log:[],startedAt:Date.now(),doneAt:null,progress:0};e.updatedAt=Date.now();save();currentTab='track';syncTab();renderList();toast('已加入追踪');}
  else if(act==='update'){trackingId=id;trackTargetText.textContent=e.text;trackProgress.value=e.track.progress||0;trackInput.value='';trackMask.classList.add('show');setTimeout(function(){trackInput.focus();},200);}
  else if(act==='done'){e.track.status='done';e.track.doneAt=Date.now();e.track.progress=100;e.updatedAt=Date.now();save();renderList();toast('已标记完成 🎉');}
});

function blobToDataURL(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsDataURL(blob);});}
function dataURLToBlob(d){var a=d.split(','),b=atob(a[1]),n=b.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=b.charCodeAt(i);var t=(a[0].split(':')[1]||'image/jpeg').split(';')[0];return new Blob([u],{type:t});}
function buildBackup(){
  return getAllPhotos().then(function(photos){
    return Promise.all(photos.map(function(p){return blobToDataURL(p.blob).then(function(d){return {id:p.id,caption:p.caption||'',createdAt:p.createdAt,updatedAt:p.updatedAt||p.createdAt,dataURL:d};});})).then(function(arr){
      return JSON.stringify({app:'shiguang',version:1,exportedAt:new Date().toISOString(),entries:state.entries,photos:arr},null,2);
    });
  }).catch(function(){return JSON.stringify({app:'shiguang',version:1,exportedAt:new Date().toISOString(),entries:state.entries,photos:[]},null,2);});
}
function downloadBackup(){
  buildBackup().then(function(txt){
    var blob=new Blob([txt],{type:'application/json'});
    var url=URL.createObjectURL(blob);var a=document.createElement('a');
    var d=new Date();var name='拾光备份_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.json';
    a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);toast('备份已下载');
  });
}
function copyBackup(){
  buildBackup().then(function(txt){
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('已复制到剪贴板');},function(){fallbackCopy(txt);});}
    else fallbackCopy(txt);
  });
}
function fallbackCopy(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('已复制');}catch(e){toast('复制失败，请手动导出');}document.body.removeChild(ta);}
document.getElementById('importFile').addEventListener('change',function(ev){
  var f=ev.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){importData(rd.result);};
  rd.readAsText(f);ev.target.value='';
});
function importData(text){
  try{
    var data=JSON.parse(text);var imported=data.entries||[];
    if(!imported.length&&!(data.photos&&data.photos.length)){toast('文件中没有内容');return;}
    function afterEntries(){
      if(data.photos&&data.photos.length){
        var tasks=data.photos.map(function(p){
          try{return putPhoto({id:p.id,caption:p.caption||'',createdAt:p.createdAt,updatedAt:p.updatedAt||p.createdAt,blob:dataURLToBlob(p.dataURL)});}catch(e){return Promise.resolve();}
        });
        return Promise.all(tasks).then(function(){return true;}).catch(function(){return true;});
      }
      return Promise.resolve(true);
    }
    if(confirm('导入模式：\n「确定」= 合并（保留原有，新增不重复的）\n「取消」= 替换（覆盖全部）')){
      var ids=new Set(state.entries.map(function(e){return e.id;}));
      var added=imported.filter(function(e){return !ids.has(e.id);});
      state.entries=state.entries.concat(added);save();
      afterEntries().then(function(){if(currentTab==='photo')renderPhotos();else renderList();toast('合并完成，新增 '+added.length+' 条');});
    }else{
      if(confirm('⚠️ 替换将清除当前全部 '+state.entries.length+' 条，确定？')){
        state.entries=imported;save();
        afterEntries().then(function(){if(currentTab==='photo')renderPhotos();else renderList();toast('替换完成');});
      }
    }
  }catch(e){toast('❌ 文件格式错误');}
}

/* ========== 光影：照片日志（IndexedDB 存储） ========== */
var DB_NAME='shiguang_photos',DB_VER=1,_db=null;
function openDB(){return new Promise(function(res,rej){var r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=function(e){var db=e.target.result;if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'id'});};r.onsuccess=function(e){_db=e.target.result;res(_db);};r.onerror=function(e){rej(e.target.error);};});}
function dbReady(){return _db?Promise.resolve(_db):openDB();}
function putPhoto(p){return dbReady().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(p);tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};});});}
function getAllPhotos(){return dbReady().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('photos','readonly');var rq=tx.objectStore('photos').getAll();rq.onsuccess=function(){res(rq.result||[]);};rq.onerror=function(){rej(rq.error);};});});}
function deletePhoto(id){return dbReady().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};});});}
function compressImageFile(file,maxDim,quality){return new Promise(function(res,rej){var reader=new FileReader();reader.onload=function(){var img=new Image();img.onload=function(){var w=img.width,h=img.height;var scale=Math.min(1,maxDim/Math.max(w,h));var cw=Math.round(w*scale),ch=Math.round(h*scale);var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;cv.getContext('2d').drawImage(img,0,0,cw,ch);cv.toBlob(function(blob){blob?res(blob):rej(new Error('compress'));},'image/jpeg',quality);};img.onerror=function(){rej(new Error('img'));};img.src=reader.result;};reader.onerror=function(){rej(reader.error);};reader.readAsDataURL(file);});}
var _photoUrls=[];
function renderPhotos(){
  tabLabelEl.textContent='光影';
  getAllPhotos().then(function(photos){
    photos.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
    tabCountEl.textContent=photos.length;
    if(!photos.length){listEl.innerHTML='<div class="empty"><div class="big">📷</div><p>随手拍下此刻的光，它会成为你相片书里的一页。</p></div>';return;}
    _photoUrls.forEach(function(u){URL.revokeObjectURL(u);});_photoUrls=[];
    var html='<div class="photo-grid">';
    photos.forEach(function(p){var u=URL.createObjectURL(p.blob);_photoUrls.push(u);html+='<div class="photo-item" data-id="'+p.id+'"><img src="'+u+'" alt=""><div class="photo-date">'+fmt(p.createdAt)+'</div><div class="photo-cap">'+(esc(p.caption)||'')+'</div></div>';});
    html+='</div>';
    listEl.innerHTML=html;
  }).catch(function(){listEl.innerHTML='<div class="empty"><div class="big">⚠️</div><p>照片读取失败，当前浏览器可能不支持本地图库。</p></div>';});
}
function handlePhotoFile(file){
  if(!file)return;
  toast('处理中…');
  compressImageFile(file,1080,0.7).then(function(blob){
    var p={id:uid(),caption:'',createdAt:Date.now(),updatedAt:Date.now(),blob:blob};
    return putPhoto(p).then(function(){if(currentTab==='photo')renderPhotos();toast('已收好这张光 📷');});
  }).catch(function(){toast('照片处理失败');});
}
var photoPickerMask=document.getElementById('photoPickerMask');
photoPickerMask.querySelector('.menu-list').addEventListener('click',function(ev){
  var item=ev.target.closest('[data-pick]');if(!item)return;
  photoPickerMask.classList.remove('show');
  if(item.dataset.pick==='camera')document.getElementById('photoCamera').click();
  else document.getElementById('photoAlbum').click();
});
document.getElementById('photoCamera').addEventListener('change',function(e){handlePhotoFile(e.target.files[0]);e.target.value='';});
document.getElementById('photoAlbum').addEventListener('change',function(e){handlePhotoFile(e.target.files[0]);e.target.value='';});
var photoMask=document.getElementById('photoMask');
var photoView=document.getElementById('photoView');
var photoCaption=document.getElementById('photoCaption');
var currentPhotoId=null;
function openPhoto(id){
  getAllPhotos().then(function(photos){
    var p=photos.find(function(x){return String(x.id)===String(id);});if(!p)return;
    currentPhotoId=p.id;
    if(photoView.dataset.url)URL.revokeObjectURL(photoView.dataset.url);
    var u=URL.createObjectURL(p.blob);photoView.src=u;photoView.dataset.url=u;
    photoCaption.value=p.caption||'';
    photoMask.classList.add('show');
  });
}
document.getElementById('photoSaveCap').addEventListener('click',function(){
  if(!currentPhotoId)return;
  getAllPhotos().then(function(photos){
    var p=photos.find(function(x){return String(x.id)===String(currentPhotoId);});if(!p)return;
    p.caption=photoCaption.value.trim();p.updatedAt=Date.now();
    putPhoto(p).then(function(){photoMask.classList.remove('show');renderPhotos();toast('注脚已更新');});
  });
});
document.getElementById('photoDelete').addEventListener('click',function(){
  if(!currentPhotoId)return;
  if(confirm('删除这张照片？')){deletePhoto(currentPhotoId).then(function(){photoMask.classList.remove('show');renderPhotos();toast('已删除');});}
});
function exportPhotoBook(){
  getAllPhotos().then(function(photos){
    if(!photos.length){toast('还没有照片可导出');return;}
    photos.sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0);});
    var book=document.getElementById('printBook');
    var html='<div class="book-cover"><h1>拾光 · 相片书</h1><p>'+new Date().toLocaleDateString('zh-CN')+'</p><p class="sub">捡拾光阴里的光</p></div>';
    photos.forEach(function(p){var u=URL.createObjectURL(p.blob);html+='<div class="book-page"><img src="'+u+'"><div class="book-cap">'+(esc(p.caption)||'')+'</div><div class="book-date">'+fmt(p.createdAt)+'</div></div>';});
    book.innerHTML=html;
    setTimeout(function(){window.print();},350);
  }).catch(function(){toast('导出失败');});
}

/* ========== 报告 ========== */
var reportMask=document.getElementById('reportMask');
function showReport(period){
  var now=Date.now();var start;
  if(period==='week'){var d=new Date();d.setHours(0,0,0,0);var day=(d.getDay()+6)%7;start=d.getTime()-day*86400000;}
  else{var dm=new Date();dm.setDate(1);dm.setHours(0,0,0,0);start=dm.getTime();}
  var inRange=state.entries.filter(function(e){return (e.createdAt||0)>=start;});
  var idea=inRange.filter(function(e){return e.type==='idea'&&!e.track;}).length;
  var beauty=inRange.filter(function(e){return e.type==='beauty';}).length;
  var track=inRange.filter(function(e){return !!e.track;}).length;
  document.getElementById('rIdea').textContent=idea;
  document.getElementById('rBeauty').textContent=beauty;
  document.getElementById('rTrack').textContent=track;
  document.getElementById('reportTitle').textContent=(period==='week'?'本周':'本月')+'复盘';
  var total=idea+beauty+track;
  var line='这段时间你拾起了 <b>'+total+'</b> 缕光——'+idea+' 个妙想、'+beauty+' 份美好、'+track+' 个正在追踪的目标。';
  if(track>0)line+=' 慢慢来，进度比速度更值得记录。';
  else if(total===0)line='还没有记录。今天就从一句话开始吧。';
  else line+=' 继续这样温柔地对待生活，就很好。';
  document.getElementById('reportLine').innerHTML=line;
  reportMask.classList.add('show');
}

/* ========== 弹窗关闭 ========== */
document.querySelectorAll('[data-close]').forEach(function(el){
  el.addEventListener('click',function(){document.getElementById(el.dataset.close).classList.remove('show');});
});
document.querySelectorAll('.mask').forEach(function(m){m.addEventListener('click',function(ev){if(ev.target===m)m.classList.remove('show');});});

/* ========== Toast ========== */
var toastEl=document.getElementById('toast');var toastTimer;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.classList.remove('show');},1800);}

/* ========== PWA 安装 ========== */
var deferredPrompt=null;
var installBanner=document.getElementById('installBanner');
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;setTimeout(function(){if(!window.matchMedia('(display-mode:standalone)').matches)installBanner.classList.add('show');},2500);});
document.getElementById('installBtn').addEventListener('click',function(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(function(){installBanner.classList.remove('show');deferredPrompt=null;});}
  else{toast('请点浏览器菜单「添加到主屏幕」');}
});
document.getElementById('installClose').addEventListener('click',function(){installBanner.classList.remove('show');localStorage.setItem('sg_no_install','1');});

/* ========== Service Worker（含自动升级） ========== */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    if(reg.waiting){reg.waiting.postMessage({type:'SKIP_WAITING'});}
    reg.addEventListener('updatefound',function(){
      var w=reg.installing;
      if(!w)return;
      w.addEventListener('statechange',function(e){
        if(e.target.state==='installed'&&navigator.serviceWorker.controller){
          toast('发现新版本，正在刷新…');
          w.postMessage({type:'SKIP_WAITING'});
        }
      });
    });
  }).catch(function(e){console.warn('SW 注册失败',e);});
  navigator.serviceWorker.addEventListener('controllerchange',function(){location.reload();});
}

/* ========== 启动 ========== */
load();initQuote();renderList();
</script>
