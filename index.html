<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="朝暮">
<meta name="theme-color" content="#f3efe8">
<meta name="description" content="朝暮，一封只写给自己的日常">
<meta name="format-detection" content="telephone=no">
<title>朝暮</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#f3efe8;
  --paper-deep:#e9e2d8;
  --card:#fbf8f2;
  --ink:#312e2a;
  --ink-soft:#746d63;
  --ink-faint:#a39b90;
  --line:rgba(71,61,51,.13);
  --accent:#945943;
  --accent-dark:#754231;
  --accent-pale:#eee1d8;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --font-kai:"Kaiti SC","STKaiti","KaiTi","Kaiti TC","BiauKai",serif;
  --font-song:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;
  --font-fangsong:"FangSong","STFangsong","FangSong_GB2312",serif;
  --font-hei:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html{min-height:100%;background:var(--paper)}
body{
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(circle at 12% 4%,rgba(255,255,255,.8),transparent 32rem),
    linear-gradient(180deg,#f6f2ec 0%,var(--paper) 42%,#efeae2 100%);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid rgba(148,89,67,.48);outline-offset:3px}
body.modal-open{overflow:hidden}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.site-header{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:calc(24px + var(--safe-top)) 24px 14px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
}
.brand{padding-top:2px}
.brand h1{
  font-family:var(--serif);
  font-size:30px;
  font-weight:500;
  line-height:1;
  letter-spacing:.2em;
}
.brand p{
  margin-top:9px;
  color:var(--ink-faint);
  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;
}
.menu-button{
  width:42px;
  height:42px;
  border:1px solid var(--line);
  border-radius:50%;
  background:rgba(251,248,242,.62);
  color:var(--ink-soft);
  font-size:20px;
  line-height:1;
}
.menu-button:active{background:var(--paper-deep)}

.app-main{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:24px 20px calc(122px + var(--safe-bottom));
}
.day-intro{
  min-height:178px;
  padding:29px 4px 34px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.day-date{
  color:var(--accent);
  font-size:11px;
  letter-spacing:.16em;
}
.day-intro h2{
  max-width:580px;
  margin-top:17px;
  font-family:var(--font-song);
  font-size:clamp(23px,6.2vw,30px);
  font-weight:500;
  line-height:1.62;
  letter-spacing:.045em;
}
.day-summary{
  margin-top:13px;
  color:var(--ink-soft);
  font-size:13px;
  line-height:1.7;
  letter-spacing:.04em;
}

.feed{padding-top:24px}
.note{
  padding:25px 4px 28px;
  border-bottom:1px solid var(--line);
  animation:note-in .42s cubic-bezier(.2,.75,.3,1) both;
}
@keyframes note-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.note-meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:18px;
}
.note-date{
  color:var(--ink-faint);
  font-size:11px;
  line-height:1.4;
  letter-spacing:.1em;
}
.note-actions{display:flex;align-items:center;gap:2px}
.text-action{
  border:0;
  background:transparent;
  padding:6px 8px;
  color:var(--ink-faint);
  font-size:11px;
  letter-spacing:.08em;
}
.text-action:active{color:var(--accent)}
.note-text{
  max-width:680px;
  font-size:clamp(17px,4.7vw,19px);
  line-height:2.02;
  letter-spacing:.045em;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.font-kai{font-family:var(--font-kai)}
.font-song{font-family:var(--font-song)}
.font-fangsong{font-family:var(--font-fangsong)}
.font-hei{font-family:var(--font-hei);letter-spacing:.02em}

.note-media{
  display:grid;
  gap:7px;
  margin-top:20px;
}
.note-media[data-count="1"]{grid-template-columns:1fr;max-width:86%}
.note-media[data-count="2"]{grid-template-columns:repeat(2,1fr);max-width:82%}
.note-media[data-count="3"]{grid-template-columns:repeat(3,1fr)}
.media-button{
  display:block;
  width:100%;
  overflow:hidden;
  border:0;
  border-radius:7px;
  background:var(--paper-deep);
  padding:0;
  aspect-ratio:1;
}
.note-media[data-count="1"] .media-button{aspect-ratio:4/3}
.media-button img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:transform .5s ease;
}
.media-button:active img{transform:scale(1.012)}

.empty-state{
  padding:74px 16px 62px;
  text-align:center;
}
.empty-seal{
  width:42px;
  height:42px;
  margin:0 auto 22px;
  border:1px solid rgba(148,89,67,.55);
  display:grid;
  place-items:center;
  color:var(--accent);
  font-family:var(--font-song);
  font-size:13px;
  letter-spacing:.15em;
}
.empty-state p{
  font-family:var(--font-kai);
  color:var(--ink-soft);
  font-size:16px;
  line-height:1.9;
  letter-spacing:.06em;
}
.empty-state button{
  margin-top:23px;
  padding:9px 2px;
  border:0;
  border-bottom:1px solid var(--accent);
  background:transparent;
  color:var(--accent);
  font-size:12px;
  letter-spacing:.12em;
}

.compose-fab{
  position:fixed;
  right:max(20px,calc((100vw - 760px)/2 + 20px));
  bottom:calc(20px + var(--safe-bottom));
  z-index:20;
  height:50px;
  padding:0 20px 0 17px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:25px;
  background:var(--ink);
  color:#fbf8f2;
  box-shadow:0 10px 26px rgba(49,46,42,.2);
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  letter-spacing:.08em;
}
.compose-fab span:first-child{font-size:22px;font-weight:300;line-height:1}
.compose-fab:active{transform:translateY(1px);background:#22201d}

.mask{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  visibility:hidden;
  align-items:flex-end;
  justify-content:center;
  background:rgba(39,35,30,.35);
  opacity:0;
  transition:opacity .22s ease,visibility .22s;
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}
.mask.show{visibility:visible;opacity:1}
.sheet{
  width:100%;
  max-width:760px;
  max-height:92vh;
  max-height:92dvh;
  overflow-y:auto;
  overscroll-behavior:contain;
  border-radius:22px 22px 0 0;
  background:#f9f6ef;
  padding:10px 20px calc(24px + var(--safe-bottom));
  transform:translateY(26px);
  transition:transform .28s cubic-bezier(.2,.75,.3,1);
  box-shadow:0 -16px 50px rgba(40,34,28,.16);
}
.mask.show .sheet{transform:translateY(0)}
.sheet-handle{
  width:36px;
  height:4px;
  margin:0 auto 19px;
  border-radius:4px;
  background:#d9d0c4;
}
.sheet-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding-bottom:18px;
}
.sheet-header h3{
  font-family:var(--font-song);
  font-size:21px;
  font-weight:500;
  letter-spacing:.09em;
}
.close-button{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--ink-soft);
  font-size:20px;
}
.close-button:active{background:var(--paper-deep)}

.editor-text{
  width:100%;
  min-height:176px;
  max-height:42vh;
  max-height:42dvh;
  padding:8px 1px 20px;
  border:0;
  border-bottom:1px solid var(--line);
  border-radius:0;
  background:transparent;
  color:var(--ink);
  font-family:var(--font-kai);
  font-size:18px;
  line-height:1.9;
  letter-spacing:.035em;
  outline:0;
  resize:none;
}
.editor-text:focus-visible{
  outline:1px solid rgba(148,89,67,.35);
  outline-offset:4px;
  border-radius:4px;
}
.editor-text::placeholder{color:#aaa196}
.field{margin-top:22px}
.field-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:11px;
}
.field-title{
  color:var(--ink-soft);
  font-size:12px;
  letter-spacing:.12em;
}
.field-note{color:var(--ink-faint);font-size:11px;letter-spacing:.06em}
.font-picker{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}
.font-choice{
  min-width:0;
  padding:11px 5px 10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:transparent;
  color:var(--ink-soft);
  font-size:14px;
}
.font-choice[aria-pressed="true"]{
  border-color:rgba(148,89,67,.55);
  background:var(--accent-pale);
  color:var(--accent-dark);
}
.editor-media{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}
.editor-photo{
  position:relative;
  overflow:hidden;
  border-radius:7px;
  background:var(--paper-deep);
  aspect-ratio:1;
}
.editor-photo img{width:100%;height:100%;display:block;object-fit:cover}
.remove-photo{
  position:absolute;
  top:5px;
  right:5px;
  width:25px;
  height:25px;
  border:0;
  border-radius:50%;
  background:rgba(31,28,24,.68);
  color:#fff;
  font-size:15px;
  line-height:1;
}
.add-photo{
  width:100%;
  margin-top:9px;
  padding:11px;
  border:1px dashed rgba(71,61,51,.22);
  border-radius:8px;
  background:transparent;
  color:var(--ink-soft);
  font-size:12px;
  letter-spacing:.08em;
}
.add-photo:disabled{color:var(--ink-faint);opacity:.52;cursor:default}
.sheet-actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:12px;
  margin-top:27px;
}
.button-secondary,.button-primary{
  min-width:92px;
  padding:12px 19px;
  border-radius:9px;
  font-size:14px;
  letter-spacing:.08em;
}
.button-secondary{border:1px solid var(--line);background:transparent;color:var(--ink-soft)}
.button-primary{border:1px solid var(--ink);background:var(--ink);color:#fffdf8}
.button-primary:disabled{opacity:.55;cursor:default}

.menu-sheet{padding-bottom:calc(18px + var(--safe-bottom))}
.menu-list{display:flex;flex-direction:column}
.menu-item{
  display:flex;
  align-items:center;
  gap:15px;
  width:100%;
  padding:16px 1px;
  border:0;
  border-top:1px solid var(--line);
  background:transparent;
  text-align:left;
}
.menu-item:last-of-type{border-bottom:1px solid var(--line)}
.menu-mark{
  width:28px;
  color:var(--accent);
  font-family:var(--font-song);
  font-size:16px;
  text-align:center;
}
.menu-copy{display:flex;flex:1;flex-direction:column;gap:4px}
.menu-copy strong{font-size:14px;font-weight:500;letter-spacing:.06em}
.menu-copy small{color:var(--ink-faint);font-size:11px;line-height:1.45}
.privacy-note{
  padding:20px 2px 2px;
  color:var(--ink-faint);
  font-family:var(--font-kai);
  font-size:12px;
  line-height:1.8;
  letter-spacing:.04em;
}

.viewer{
  z-index:60;
  align-items:center;
  background:rgba(24,22,19,.92);
  padding:calc(18px + var(--safe-top)) 18px calc(22px + var(--safe-bottom));
}
.viewer .viewer-close{
  position:absolute;
  top:calc(13px + var(--safe-top));
  right:16px;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:21px;
}
.viewer img{
  display:block;
  max-width:100%;
  max-height:78vh;
  max-height:78dvh;
  object-fit:contain;
  border-radius:5px;
}
.viewer-date{
  position:absolute;
  bottom:calc(18px + var(--safe-bottom));
  left:20px;
  right:20px;
  color:rgba(255,255,255,.62);
  font-size:11px;
  text-align:center;
  letter-spacing:.1em;
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(88px + var(--safe-bottom));
  z-index:80;
  max-width:calc(100vw - 40px);
  padding:9px 16px;
  border-radius:20px;
  background:rgba(49,46,42,.94);
  color:#fffdf8;
  font-size:12px;
  line-height:1.5;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,6px);
  transition:opacity .2s ease,transform .2s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:640px){
  .site-header{padding-left:32px;padding-right:32px}
  .app-main{padding-left:32px;padding-right:32px}
  .note{padding-top:29px;padding-bottom:32px}
  .sheet{border-radius:22px 22px 0 0;padding-left:28px;padding-right:28px}
}
@media (max-width:390px){
  .app-main{padding-left:17px;padding-right:17px}
  .site-header{padding-left:20px;padding-right:20px}
  .font-picker{gap:5px}
  .font-choice{padding-left:2px;padding-right:2px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<header class="site-header">
  <div class="brand">
    <h1>朝暮</h1>
    <p>Private notes</p>
  </div>
  <button class="menu-button" id="menuBtn" type="button" aria-label="更多选项">···</button>
</header>

<main class="app-main">
  <section class="day-intro" aria-labelledby="dayHeading">
    <p class="day-date" id="dayDate"></p>
    <h2 id="dayHeading">把此刻，轻轻写下。</h2>
    <p class="day-summary" id="daySummary">这里只留给你自己。</p>
  </section>

  <section class="feed" id="feed" aria-label="随笔记录"></section>
</main>

<button class="compose-fab" id="createBtn" type="button" aria-label="写一篇随笔">
  <span aria-hidden="true">＋</span>
  <span>写一篇</span>
</button>

<div class="mask" id="editorMask" aria-hidden="true">
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-header">
      <h3 id="editorTitle">写一页</h3>
      <button class="close-button" type="button" data-close="editorMask" aria-label="关闭">×</button>
    </div>

    <label class="sr-only" for="editorText">随笔正文</label>
    <textarea class="editor-text" id="editorText" maxlength="10000" placeholder="写下今天想留住的事……"></textarea>

    <div class="field">
      <div class="field-heading">
        <span class="field-title">字迹</span>
        <span class="field-note">用于这篇随笔</span>
      </div>
      <div class="font-picker" role="group" aria-label="选择正文字体">
        <button class="font-choice font-kai" type="button" data-font="kai" aria-pressed="true">楷体</button>
        <button class="font-choice font-song" type="button" data-font="song" aria-pressed="false">宋体</button>
        <button class="font-choice font-fangsong" type="button" data-font="fangsong" aria-pressed="false">仿宋</button>
        <button class="font-choice font-hei" type="button" data-font="hei" aria-pressed="false">黑体</button>
      </div>
    </div>

    <div class="field">
      <div class="field-heading">
        <span class="field-title">照片</span>
        <span class="field-note" id="photoCount">0 / 3</span>
      </div>
      <div class="editor-media" id="editorMedia"></div>
      <button class="add-photo" id="addPhotosBtn" type="button">从相册选择</button>
      <input class="sr-only" type="file" id="photoInput" accept="image/*" multiple>
    </div>

    <div class="sheet-actions">
      <button class="button-secondary" type="button" data-close="editorMask">取消</button>
      <button class="button-primary" id="saveBtn" type="button">收好</button>
    </div>
  </section>
</div>

<div class="mask" id="menuMask" aria-hidden="true">
  <section class="sheet menu-sheet" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-header">
      <h3 id="menuTitle">留存</h3>
      <button class="close-button" type="button" data-close="menuMask" aria-label="关闭">×</button>
    </div>
    <div class="menu-list">
      <button class="menu-item" id="exportBtn" type="button">
        <span class="menu-mark" aria-hidden="true">下</span>
        <span class="menu-copy"><strong>导出备份</strong><small>文字和照片会一起保存</small></span>
      </button>
      <button class="menu-item" id="importBtn" type="button">
        <span class="menu-mark" aria-hidden="true">上</span>
        <span class="menu-copy"><strong>导入备份</strong><small>从之前导出的文件中找回记录</small></span>
      </button>
      <button class="menu-item" id="installBtn" type="button">
        <span class="menu-mark" aria-hidden="true">藏</span>
        <span class="menu-copy"><strong>放到手机桌面</strong><small>像普通应用一样打开</small></span>
      </button>
    </div>
    <p class="privacy-note">所有内容只保存在当前浏览器里。换手机或清理网站数据前，请先导出一份备份。</p>
    <input class="sr-only" type="file" id="importInput" accept="application/json,.json">
  </section>
</div>

<div class="mask viewer" id="viewerMask" aria-hidden="true">
  <button class="viewer-close" type="button" data-close="viewerMask" aria-label="关闭照片">×</button>
  <img id="viewerImage" src="" alt="随笔照片">
  <p class="viewer-date" id="viewerDate"></p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const DATA_KEY = 'zhaomu_notes_v1';
const DB_NAME = 'zhaomu_photos';
const DB_VERSION = 1;
const PHOTO_LIMIT = 3;
const MAX_FILE_BYTES = 30 * 1024 * 1024;
const FONTS = ['kai', 'song', 'fangsong', 'hei'];

let state = { entries: [] };
let photoMap = new Map();
let editingId = null;
let editorPhotos = [];
let editorFont = 'kai';
let feedUrls = [];
let editorUrls = [];
let viewerUrl = '';
let db = null;
let deferredPrompt = null;
let toastTimer = 0;

const feedEl = document.getElementById('feed');
const editorMask = document.getElementById('editorMask');
const editorText = document.getElementById('editorText');
const editorTitle = document.getElementById('editorTitle');
const editorMedia = document.getElementById('editorMedia');
const photoInput = document.getElementById('photoInput');
const addPhotosBtn = document.getElementById('addPhotosBtn');
const photoCount = document.getElementById('photoCount');
const saveBtn = document.getElementById('saveBtn');
const toastEl = document.getElementById('toast');

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function safeFont(font) {
  return FONTS.includes(font) ? font : 'kai';
}

function numberDate(value) {
  const number = Number(value);
  return Number.isFinite(number) && Math.abs(number) < 8640000000000000 ? number : Date.now();
}

function normalizeEntry(raw) {
  if (!raw || typeof raw !== 'object' || !String(raw.text || '').trim()) return null;
  return {
    id: String(raw.id || uid()),
    text: String(raw.text),
    font: safeFont(raw.font),
    photoIds: Array.isArray(raw.photoIds) ? raw.photoIds.slice(0, PHOTO_LIMIT).map(String) : [],
    createdAt: numberDate(raw.createdAt),
    updatedAt: numberDate(raw.updatedAt || raw.createdAt)
  };
}

function loadEntries() {
  try {
    const saved = JSON.parse(localStorage.getItem(DATA_KEY) || '{}');
    state.entries = Array.isArray(saved.entries) ? saved.entries.map(normalizeEntry).filter(Boolean) : [];
  } catch {
    state.entries = [];
  }
}

function saveEntries() {
  try {
    localStorage.setItem(DATA_KEY, JSON.stringify({ version: 1, entries: state.entries }));
  } catch {
    throw new Error('storage-full');
  }
}

function openPhotoDB() {
  if (db) return Promise.resolve(db);
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = event => {
      const database = event.target.result;
      if (!database.objectStoreNames.contains('photos')) {
        database.createObjectStore('photos', { keyPath: 'id' });
      }
    };
    request.onsuccess = event => {
      db = event.target.result;
      resolve(db);
    };
    request.onerror = () => reject(request.error);
  });
}

async function getAllPhotos() {
  const database = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const request = database.transaction('photos', 'readonly').objectStore('photos').getAll();
    request.onsuccess = () => resolve(request.result || []);
    request.onerror = () => reject(request.error);
  });
}

async function putPhoto(photo) {
  const database = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const transaction = database.transaction('photos', 'readwrite');
    transaction.objectStore('photos').put(photo);
    transaction.oncomplete = () => resolve();
    transaction.onerror = () => reject(transaction.error);
  });
}

async function deletePhoto(id) {
  const database = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const transaction = database.transaction('photos', 'readwrite');
    transaction.objectStore('photos').delete(String(id));
    transaction.oncomplete = () => resolve();
    transaction.onerror = () => reject(transaction.error);
  });
}

async function refreshPhotos() {
  const photos = await getAllPhotos();
  photoMap = new Map(photos.map(photo => [String(photo.id), photo]));
}

function weekName(date) {
  return ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][date.getDay()];
}

function pad(value) {
  return String(value).padStart(2, '0');
}

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function feedDate(timestamp) {
  const date = new Date(timestamp);
  const now = new Date();
  const yesterday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
  const time = pad(date.getHours()) + ':' + pad(date.getMinutes());
  if (sameDay(date, now)) return '今天 · ' + time;
  if (sameDay(date, yesterday)) return '昨天 · ' + time;
  const year = date.getFullYear() === now.getFullYear() ? '' : date.getFullYear() + '年';
  return year + (date.getMonth() + 1) + '月' + date.getDate() + '日 · ' + time;
}

function fullDate(timestamp) {
  const date = new Date(timestamp);
  return date.getFullYear() + '年' + (date.getMonth() + 1) + '月' + date.getDate() + '日 · ' +
    weekName(date) + ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes());
}

function updateDayIntro() {
  const now = new Date();
  document.getElementById('dayDate').textContent =
    now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 · ' + weekName(now);

  const hour = now.getHours();
  let heading = '把此刻，轻轻写下。';
  if (hour >= 5 && hour < 9) heading = '晨光落在纸上。';
  else if (hour >= 9 && hour < 12) heading = '把此刻，轻轻写下。';
  else if (hour >= 12 && hour < 18) heading = '日子正在慢慢经过。';
  else if (hour >= 18 && hour < 23) heading = '夜色替今天收尾。';
  else heading = '把未说出口的话，留在这里。';
  document.getElementById('dayHeading').textContent = heading;

  const today = state.entries.filter(entry => sameDay(new Date(entry.createdAt), now)).length;
  const total = state.entries.length;
  document.getElementById('daySummary').textContent = total
    ? '今天写下 ' + today + ' 篇，一共收好 ' + total + ' 篇。'
    : '这里只留给你自己。';
}

function revokeUrls(urls) {
  urls.forEach(url => URL.revokeObjectURL(url));
}

function renderFeed() {
  revokeUrls(feedUrls);
  feedUrls = [];
  updateDayIntro();
  const entries = state.entries.slice().sort((a, b) => b.createdAt - a.createdAt);

  if (!entries.length) {
    feedEl.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-seal">留白</div>' +
        '<p>今天还没有留下字句。<br>一页纸，等你把此刻放进去。</p>' +
        '<button type="button" data-action="create">写第一页</button>' +
      '</div>';
    return;
  }

  feedEl.innerHTML = entries.map(entry => {
    const photos = entry.photoIds.map(id => photoMap.get(id)).filter(Boolean);
    const media = photos.map(photo => {
      const url = URL.createObjectURL(photo.blob);
      feedUrls.push(url);
      return '<button class="media-button" type="button" data-action="view" data-photo-id="' +
        escapeHtml(photo.id) + '" aria-label="查看照片"><img src="' + url + '" alt=""></button>';
    }).join('');

    return '<article class="note" data-id="' + escapeHtml(entry.id) + '">' +
      '<div class="note-meta"><time class="note-date" datetime="' + new Date(entry.createdAt).toISOString() + '">' +
        escapeHtml(feedDate(entry.createdAt)) + '</time>' +
        '<div class="note-actions">' +
          '<button class="text-action" type="button" data-action="edit">编辑</button>' +
          '<button class="text-action" type="button" data-action="delete">删除</button>' +
        '</div></div>' +
      '<p class="note-text font-' + safeFont(entry.font) + '">' + escapeHtml(entry.text) + '</p>' +
      (media ? '<div class="note-media" data-count="' + photos.length + '">' + media + '</div>' : '') +
      '</article>';
  }).join('');
}

function openMask(element) {
  document.querySelectorAll('.mask.show').forEach(mask => {
    if (mask !== element) closeMask(mask);
  });
  element.classList.add('show');
  element.setAttribute('aria-hidden', 'false');
  document.body.classList.add('modal-open');
}

function closeMask(element) {
  element.classList.remove('show');
  element.setAttribute('aria-hidden', 'true');
  if (!document.querySelector('.mask.show')) document.body.classList.remove('modal-open');
}

function showToast(message) {
  clearTimeout(toastTimer);
  toastEl.textContent = message;
  toastEl.classList.add('show');
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function resizeEditor() {
  editorText.style.height = 'auto';
  editorText.style.height = Math.min(editorText.scrollHeight, window.innerHeight * .42) + 'px';
}

function setEditorFont(font) {
  editorFont = safeFont(font);
  editorText.className = 'editor-text font-' + editorFont;
  document.querySelectorAll('.font-choice').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.font === editorFont));
  });
}

function renderEditorPhotos() {
  revokeUrls(editorUrls);
  editorUrls = [];
  editorMedia.innerHTML = editorPhotos.map(photo => {
    const url = URL.createObjectURL(photo.blob);
    editorUrls.push(url);
    return '<div class="editor-photo"><img src="' + url + '" alt="">' +
      '<button class="remove-photo" type="button" data-remove-photo="' + escapeHtml(photo.id) +
      '" aria-label="移除照片">×</button></div>';
  }).join('');
  photoCount.textContent = editorPhotos.length + ' / ' + PHOTO_LIMIT;
  addPhotosBtn.disabled = editorPhotos.length >= PHOTO_LIMIT;
  addPhotosBtn.textContent = editorPhotos.length >= PHOTO_LIMIT ? '已达 3 张' : '从相册选择';
}

function openEditor(entry) {
  editingId = entry ? entry.id : null;
  editorPhotos = entry
    ? entry.photoIds.map(id => photoMap.get(id)).filter(Boolean).map(photo => ({ ...photo }))
    : [];
  editorTitle.textContent = entry ? '重读这一页' : '写一页';
  editorText.value = entry ? entry.text : '';
  setEditorFont(entry ? entry.font : 'kai');
  renderEditorPhotos();
  openMask(editorMask);
  setTimeout(() => {
    editorText.focus();
    editorText.setSelectionRange(editorText.value.length, editorText.value.length);
    resizeEditor();
  }, 230);
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const sourceUrl = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => {
      try {
        const scale = Math.min(1, 1600 / Math.max(image.naturalWidth, image.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
        canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
          URL.revokeObjectURL(sourceUrl);
          blob ? resolve(blob) : reject(new Error('compress-failed'));
        }, 'image/jpeg', .8);
      } catch (error) {
        URL.revokeObjectURL(sourceUrl);
        reject(error);
      }
    };
    image.onerror = () => {
      URL.revokeObjectURL(sourceUrl);
      reject(new Error('image-failed'));
    };
    image.src = sourceUrl;
  });
}

async function addSelectedPhotos(files) {
  const remaining = PHOTO_LIMIT - editorPhotos.length;
  if (remaining <= 0) {
    showToast('每篇随笔最多 3 张照片');
    return;
  }

  const selected = Array.from(files).filter(file => file.type.startsWith('image/'));
  const accepted = selected.slice(0, remaining);
  if (selected.length < files.length || files.length > remaining) showToast('只保留前 3 张照片');
  if (!accepted.length) return;

  addPhotosBtn.disabled = true;
  addPhotosBtn.textContent = '正在整理…';
  for (const file of accepted) {
    if (file.size > MAX_FILE_BYTES) {
      showToast('有一张照片超过 30MB，已跳过');
      continue;
    }
    try {
      const blob = await compressImage(file);
      editorPhotos.push({
        id: uid(),
        entryId: editingId || '',
        blob,
        createdAt: Date.now(),
        updatedAt: Date.now()
      });
      renderEditorPhotos();
    } catch {
      showToast('有一张照片无法读取');
    }
  }
  renderEditorPhotos();
}

async function saveEditor() {
  const text = editorText.value.trim();
  if (!text) {
    showToast('先写下一句话吧');
    editorText.focus();
    return;
  }

  saveBtn.disabled = true;
  saveBtn.textContent = '正在收好';
  const now = Date.now();
  const oldEntry = editingId ? state.entries.find(entry => entry.id === editingId) : null;
  const id = oldEntry ? oldEntry.id : uid();
  const entry = {
    id,
    text,
    font: editorFont,
    photoIds: editorPhotos.map(photo => String(photo.id)),
    createdAt: oldEntry ? oldEntry.createdAt : now,
    updatedAt: now
  };

  try {
    for (const photo of editorPhotos) {
      await putPhoto({ ...photo, entryId: id, id: String(photo.id), updatedAt: now });
    }
    if (oldEntry) {
      state.entries = state.entries.map(item => item.id === id ? entry : item);
    } else {
      state.entries.push(entry);
    }
    saveEntries();

    if (oldEntry) {
      const removedIds = oldEntry.photoIds.filter(photoId => !entry.photoIds.includes(String(photoId)));
      await Promise.allSettled(removedIds.map(deletePhoto));
    }

    await refreshPhotos();
    closeMask(editorMask);
    renderFeed();
    showToast(oldEntry ? '这一页已更新' : '已经收好');
  } catch (error) {
    showToast(error.message === 'storage-full' ? '本地空间已满，请先导出备份' : '保存失败，请再试一次');
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = '收好';
  }
}

async function deleteEntry(entry) {
  if (!confirm('删除这一页文字和照片？')) return;
  const previousEntries = state.entries;
  state.entries = state.entries.filter(item => item.id !== entry.id);
  try {
    saveEntries();
    await Promise.allSettled(entry.photoIds.map(deletePhoto));
    await refreshPhotos();
    renderFeed();
    showToast('这一页已删除');
  } catch {
    state.entries = previousEntries;
    showToast('删除失败，请检查浏览器存储空间');
  }
}

function openViewer(photoId) {
  const photo = photoMap.get(String(photoId));
  if (!photo) return;
  if (viewerUrl) URL.revokeObjectURL(viewerUrl);
  viewerUrl = URL.createObjectURL(photo.blob);
  document.getElementById('viewerImage').src = viewerUrl;
  document.getElementById('viewerDate').textContent = fullDate(photo.createdAt);
  openMask(document.getElementById('viewerMask'));
}

function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

function dataURLToBlob(dataUrl) {
  const parts = String(dataUrl || '').split(',');
  if (parts.length !== 2) throw new Error('invalid-image');
  const binary = atob(parts[1]);
  const bytes = new Uint8Array(binary.length);
  for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
  const type = (parts[0].split(':')[1] || 'image/jpeg').split(';')[0];
  return new Blob([bytes], { type });
}

async function buildBackup() {
  await refreshPhotos();
  const photos = Array.from(photoMap.values());
  const encoded = await Promise.all(photos.map(async photo => ({
    id: String(photo.id),
    entryId: String(photo.entryId || ''),
    createdAt: numberDate(photo.createdAt),
    updatedAt: numberDate(photo.updatedAt || photo.createdAt),
    dataURL: await blobToDataURL(photo.blob)
  })));
  return JSON.stringify({
    app: 'zhaomu',
    version: 1,
    exportedAt: new Date().toISOString(),
    entries: state.entries,
    photos: encoded
  }, null, 2);
}

async function exportBackup() {
  closeMask(document.getElementById('menuMask'));
  showToast('正在整理备份…');
  try {
    const content = await buildBackup();
    const url = URL.createObjectURL(new Blob([content], { type: 'application/json' }));
    const link = document.createElement('a');
    const now = new Date();
    link.href = url;
    link.download = '朝暮备份_' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + '.json';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('备份已导出');
  } catch {
    showToast('备份导出失败');
  }
}

async function importBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    const incomingEntries = Array.isArray(data.entries) ? data.entries.map(normalizeEntry).filter(Boolean) : [];
    const incomingPhotos = Array.isArray(data.photos) ? data.photos : [];
    if (!incomingEntries.length && !incomingPhotos.length) throw new Error('empty-backup');

    for (const photo of incomingPhotos) {
      try {
        await putPhoto({
          id: String(photo.id),
          entryId: String(photo.entryId || ''),
          createdAt: numberDate(photo.createdAt),
          updatedAt: numberDate(photo.updatedAt || photo.createdAt),
          blob: dataURLToBlob(photo.dataURL)
        });
      } catch {
        // A damaged photo should not block the rest of a valid backup.
      }
    }

    const existingIds = new Set(state.entries.map(entry => entry.id));
    const added = incomingEntries.filter(entry => !existingIds.has(entry.id));
    state.entries = state.entries.concat(added);
    saveEntries();
    await refreshPhotos();
    renderFeed();
    closeMask(document.getElementById('menuMask'));
    showToast('已找回 ' + added.length + ' 篇随笔');
  } catch {
    showToast('备份文件无法读取');
  }
}

async function installApp() {
  closeMask(document.getElementById('menuMask'));
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    return;
  }
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  showToast(isIos ? '在 Safari 分享菜单中选择“添加到主屏幕”' : '在浏览器菜单中选择“添加到主屏幕”');
}

document.getElementById('dayDate').textContent = '';
document.getElementById('createBtn').addEventListener('click', () => openEditor(null));
document.getElementById('menuBtn').addEventListener('click', () => openMask(document.getElementById('menuMask')));
document.getElementById('saveBtn').addEventListener('click', saveEditor);
document.getElementById('addPhotosBtn').addEventListener('click', () => photoInput.click());
document.getElementById('exportBtn').addEventListener('click', exportBackup);
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importInput').click());
document.getElementById('installBtn').addEventListener('click', installApp);

editorText.addEventListener('input', resizeEditor);
editorText.addEventListener('focus', resizeEditor);
photoInput.addEventListener('change', async event => {
  await addSelectedPhotos(event.target.files);
  event.target.value = '';
});
document.getElementById('importInput').addEventListener('change', async event => {
  const file = event.target.files[0];
  if (file) await importBackup(file);
  event.target.value = '';
});

document.querySelectorAll('.font-choice').forEach(button => {
  button.addEventListener('click', () => setEditorFont(button.dataset.font));
});

editorMedia.addEventListener('click', event => {
  const button = event.target.closest('[data-remove-photo]');
  if (!button) return;
  editorPhotos = editorPhotos.filter(photo => photo.id !== button.dataset.removePhoto);
  renderEditorPhotos();
});

feedEl.addEventListener('click', event => {
  const actionEl = event.target.closest('[data-action]');
  if (!actionEl) return;
  if (actionEl.dataset.action === 'create') {
    openEditor(null);
    return;
  }
  const note = actionEl.closest('.note');
  const entry = note ? state.entries.find(item => item.id === note.dataset.id) : null;
  if (!entry) return;
  if (actionEl.dataset.action === 'edit') openEditor(entry);
  else if (actionEl.dataset.action === 'delete') deleteEntry(entry);
  else if (actionEl.dataset.action === 'view') openViewer(actionEl.dataset.photoId);
});

document.querySelectorAll('[data-close]').forEach(button => {
  button.addEventListener('click', () => {
    const mask = document.getElementById(button.dataset.close);
    if (mask.id === 'viewerMask' && viewerUrl) {
      URL.revokeObjectURL(viewerUrl);
      viewerUrl = '';
      document.getElementById('viewerImage').removeAttribute('src');
    }
    closeMask(mask);
  });
});

document.querySelectorAll('.mask').forEach(mask => {
  mask.addEventListener('click', event => {
    if (event.target !== mask) return;
    if (mask.id === 'viewerMask' && viewerUrl) {
      URL.revokeObjectURL(viewerUrl);
      viewerUrl = '';
    }
    closeMask(mask);
  });
});

document.addEventListener('keydown', event => {
  if (event.key !== 'Escape') return;
  const visible = Array.from(document.querySelectorAll('.mask.show')).pop();
  if (visible) closeMask(visible);
});

window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  deferredPrompt = event;
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(registration => {
    registration.addEventListener('updatefound', () => {
      const worker = registration.installing;
      if (!worker) return;
      worker.addEventListener('statechange', () => {
        if (worker.state === 'installed' && navigator.serviceWorker.controller) {
          showToast('新版本已准备好，下次打开会自动更新');
        }
      });
    });
  }).catch(() => {});
}

async function start() {
  loadEntries();
  try {
    await refreshPhotos();
  } catch {
    photoMap = new Map();
    showToast('照片库暂时无法打开');
  }
  renderFeed();
}

start();
</script>
</body>
